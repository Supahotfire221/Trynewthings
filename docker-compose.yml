version: '3.8'

services:
  # Backend Flask Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://faceswap:password@postgres:5432/faceswap
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_FOLDER=/app/uploads
      - PROCESSED_FOLDER=/app/processed
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - processed_data:/app/processed
      - models_data:/app/models
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - faceswap-network

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - faceswap-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=faceswap
      - POSTGRES_USER=faceswap
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - faceswap-network

  # Redis for Celery Queue and Caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - faceswap-network

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.services.job_processor worker --loglevel=info
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://faceswap:password@postgres:5432/faceswap
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_FOLDER=/app/uploads
      - PROCESSED_FOLDER=/app/processed
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - processed_data:/app/processed
      - models_data:/app/models
    depends_on:
      - postgres
      - redis
      - backend
    restart: unless-stopped
    networks:
      - faceswap-network

  # Celery Beat (for periodic tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.services.job_processor beat --loglevel=info
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://faceswap:password@postgres:5432/faceswap
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - backend
    restart: unless-stopped
    networks:
      - faceswap-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  processed_data:
  models_data:

networks:
  faceswap-network:
    driver: bridge