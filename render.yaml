services:
  - type: web
    name: faceswap-ai
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python run_production.py"
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: faceswap-storage
      mountPath: /app/uploads
      sizeGB: 10